{% extends "admin_base.html" %}
{% load static %}

{% block content1 %}

<link rel="stylesheet" href="{% static 'css/agency_form.css' %}">

<div class="form-container">

    <div class="form-card">

        <h1>Edit Agency</h1>

        <form method="POST">

            {% csrf_token %}

            <div class="form-grid">

                <div>

                    <label>Username</label>

                    <input
                        type="text"
                        name="username"
                        value="{{ agency.user.username }}"
                        required>

                </div>

                <div>

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        value="{{ agency.user.email }}"
                        required>

                </div>

                <div>

                    <label>New Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Leave blank to keep current password">

                </div>

            </div>

            <button type="submit" class="save-btn">

                Save Changes

            </button>

        </form>

    </div>

</div>

{% endblock %}
