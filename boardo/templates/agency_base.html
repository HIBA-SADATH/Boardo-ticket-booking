{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        {% block title %}
            Boardo Agency
        {% endblock %}

    </title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Agency CSS -->

    <link
        rel="stylesheet"
        href="{% static 'css/agency_base.css' %}">

    {% block extra_css %}
    {% endblock %}

</head>

<body>

<!-- ========================= -->
<!-- NAVBAR -->
<!-- ========================= -->

<header class="agency-navbar">

    <!-- Logo -->

    <a href="{% url 'agencydashboard' %}" class="brand">

        <svg
            width="42"
            height="42"
            viewBox="0 0 124 124">

            <defs>

                <linearGradient id="agencyLogo">

                    <stop offset="0%" stop-color="#14F1D9"/>

                    <stop offset="100%" stop-color="#6D5DFC"/>

                </linearGradient>

            </defs>

            <polygon
                points="62,0 116,31 116,93 62,124 8,93 8,31"
                fill="#111827"/>

            <polygon
                points="62,0 116,31 116,93 62,124 8,93 8,31"
                fill="none"
                stroke="url(#agencyLogo)"
                stroke-width="3"/>

            <path
                d="M64 46 L82 62 L64 78"
                fill="none"
                stroke="url(#agencyLogo)"
                stroke-width="8"/>

        </svg>

        <div>

            <h2>

                Board<span>o</span>

            </h2>

            <small>

                Agency Dashboard

            </small>

        </div>

    </a>

    <!-- Navigation -->

    <nav class="agency-menu">

        <a
            href="{% url 'agencydashboard' %}"
            class="{% if request.resolver_match.url_name == 'agencydashboard' %}active{% endif %}">

            Dashboard

        </a>

        <a
            href="{% url 'vehiclelist'%}">

            Vehicles

        </a>

        <a
            href="#trips">

            Trips

        </a>

        <a
            href="#bookings">

            Bookings

        </a>

        <a
            href="{% url 'agency_report' %}">

            Reports

        </a>
       
         <a
            href="{% url 'logout'%}">

            Logout

        </a>

    </nav>

    <!-- Right Side -->

    <div class="nav-right">

        <button class="icon-btn">

            🔔

        </button>

        <button class="icon-btn">

            ⚙

        </button>

        <div class="profile">

            <div class="avatar">

                {{ request.user.username|slice:":1"|upper }}

            </div>

            <div>

                <strong>

                    {{ request.user.username }}

                </strong>

                <small>

                    Agency Owner

                </small>

            </div>

        </div>

    </div>

</header>

<!-- ========================= -->
<!-- PAGE CONTENT -->
<!-- ========================= -->

<main class="agency-main">

    {% block content2 %}
    {% endblock %}

</main>
