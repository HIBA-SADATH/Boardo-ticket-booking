{% load static %}
{% load humanize %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" 
          content="width=device-width, initial-scale=1.0">


    <title>
        Voyago | Admin Dashboard
    </title>


    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" 
          href="https://fonts.gstatic.com" 
          crossorigin>


    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
          rel="stylesheet">


    <link rel="stylesheet"
          href="{% static 'css/admin_base.css' %}">

</head>



<body>


<div class="dashboard">



    <aside class="sidebar">



        <div class="brand">


            <a href="{% url 'home' %}"
               class="logo">


                <svg width="40"
                     height="40"
                     viewBox="0 0 124 124">


                    <defs>

                        <linearGradient id="logoGradient">

                            <stop offset="0%"
                                  stop-color="#00E5D8"/>

                            <stop offset="100%"
                                  stop-color="#7B5CFA"/>

                        </linearGradient>

                    </defs>



                    <polygon
                        points="62,0 116,31 116,93 62,124 8,93 8,31"
                        fill="#111827"/>



                    <polygon
                        points="62,0 116,31 116,93 62,124 8,93 8,31"
                        fill="none"
                        stroke="url(#logoGradient)"
                        stroke-width="3"/>



                    <path
                        d="M64 46 L82 62 L64 78"
                        fill="none"
                        stroke="url(#logoGradient)"
                        stroke-width="8"/>


                </svg>



                <h2>
                    Voya<span>go</span>
                </h2>


            </a>


        </div>





        <div class="menu-title">

            MAIN MENU

        </div>




        <nav aria-label="Admin navigation">


            <a href="{% url 'admindashboard' %}">

                📊 Dashboard

            </a>



            <a href="{% url 'agency_list' %}">

                🏢 Agencies

            </a>


            <a href="{% url 'admin_reports' %}">

                📈 Reports

            </a>




            <a href="{% url 'admin_settings' %}">

                ⚙ Settings

            </a>


        </nav>







        <div class="sidebar-bottom">


            <div class="admin-card">


                <div class="avatar">


                    {{ request.user.username|default:"A"|slice:":1"|upper }}


                </div>




                <div>


                    <h6>

                        {{ request.user.username }}

                    </h6>


                    <small>
                        Administrator
                    </small>


                </div>


            </div>





            <a href="{% url 'logout' %}"
               class="logout-btn">

                Logout

            </a>



        </div>




    </aside>







    <main class="dashboard-content">


        {% block content1 %}

        {% endblock %}


    </main>





</div>





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>


</html>
