{% extends "admin_base.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/agency_form.css' %}">

<div class="form-container">

    <div class="form-card">

        <h1>Delete Agency</h1>

        <p>

            Are you sure you want to delete

            <strong>{{ agency.user.username }}</strong>?

        </p>

        <p>
            This action cannot be undone.
        </p>

        <form method="POST">

            {% csrf_token %}

            <button type="submit" class="delete-btn">

                Delete Agency

            </button>

            <a href="{% url 'agency_list' %}" class="cancel-btn">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
